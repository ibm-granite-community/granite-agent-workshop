    - About the workshop: README.md
    - About Granite: about-granite.md
  - Workshop:
    - Getting Started: getting-started/README.md
    - 1. Access the Model: part-01-access-the-model/README.md
    - 2. Building Agents:
      - Overview: part-02-building-agents/README.md
      - 2.1 Function Calling Agent: part-02-building-agents/function-calling.md
      - 2.2 Plan-and-Solve Agent: part-02-building-agents/plan-and-solve.md
      - 2.3 Route-and-Solve Agent: part-02-building-agents/route-and-solve.md
      - 2.4 ToolRAG Agent: part-02-building-agents/toolrag.md
      - 2.5 ReAct Agent: part-02-building-agents/react.md
      - 2.6 Agent Harnesses: part-02-building-agents/agent-harness.md
    - 3. Observing Agents: part-03-observing-agents/README.md
    - 4. Testing Agents: part-04-testing-agents/README.md
    - 5. Packaging Agents:
      - Overview: part-05-packaging-agents/README.md
      - 5.1 Packaging Tools with MCP: part-05-packaging-agents/mcp.md
      - 5.2 Packaging Agents with A2A: part-05-packaging-agents/a2a.md
    - 6. Advanced Agent Topics:
      - Overview: part-06-advanced-topics/README.md
      - 6.1 Context Engineering: part-06-advanced-topics/context-engineering.md
      - 6.2 Agent Security: part-06-advanced-topics/agent-security.md
      - 6.3 Small Language Models: part-06-advanced-topics/slms.md
  - References:
    - Building Agents with Granite - From Prototype to Production: https://github.com/ibm-granite-community/granite-agent-cookbook/blob/main/building_agents.md
    - Testing agents: https://github.com/ibm-granite-community/granite-agent-cookbook/blob/main/testing_agents.md
    - CI/CD for agentic development: https://github.com/ibm-granite-community/granite-agent-cookbook/blob/main/cicd_agent-dev-blog.md



# Open content links in a new tab
extra_javascript:
  - javascripts/new-tab.js

## DO NOT CHANGE BELOW THIS LINE

# Copyright
copyright: Copyright &copy; 2026- IBM Research

# Theme
theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    logo: material/library
  logo: images/ibm-blue-background.png
  favicon: images/ibm-blue-background.png
  features:
    - navigation.tabs
    - navigation.footer
    #- navigation.instant
    - content.code.copy
  palette:
    scheme: default
    primary: blue
    accent: blue

extra_css:
  - "data:text/css,.md-header__button.md-logo img,.md-header__button.md-logo svg{height:2.5rem;width:auto;}.md-header__title{font-size:1.2rem;font-weight:500;}"

# Plugins
plugins:
  - search
  - social
  - macros:
      on_undefined: strict

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ibm
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/ibmdeveloper
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/ibm/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/user/developerworks
    - icon: fontawesome/brands/dev
      link: https://dev.to/ibmdeveloper
  colab_url: https://colab.research.google.com/github/jslecointre/granite-agent-workshop
  repo_branch: tx-26-lab

# Extensions
markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.blocks.admonition:
      types:
        - note
        - abstract
        - info
        - tip
        - success
        - question
        - warning
        - failure
        - danger
        - bug
        - example
        - quote
  - pymdownx.blocks.caption:
  - pymdownx.blocks.tab:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
