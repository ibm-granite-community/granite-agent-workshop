# Project information
site_name: "Building Efficient AI Agents with IBM Granite"
site_url: https://ibm-granite-community.github.io/granite-agent-workshop
site_author: IBM Research

# Repository
repo_name: granite-agent-workshop
repo_url: https://github.com/jslecointre/granite-agent-workshop
edit_uri: edit/tx-26-lab/docs

